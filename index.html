<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت مالی غلام سرور حسنی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        /* Dark Mode Variables */
        body.dark-mode {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-light: #94a3b8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; transition: background 0.3s, color 0.3s; }
        
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; }
        
        .app-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }
        
        .header h1 { font-size: 1.8rem; margin-bottom: 5px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* Theme Toggle */
        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.3); }

        .tabs-nav { display: flex; background: var(--bg); padding: 10px; gap: 10px; }
        .tab-btn {
            flex: 1; padding: 15px; border: none; background: transparent; cursor: pointer;
            font-weight: 700; color: var(--text-light); border-radius: 12px; transition: 0.3s;
        }
        .tab-btn.active { background: var(--card); color: var(--primary); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        
        .content-area { padding: 30px; }
        .tab-content { display: none; animation: fadeIn 0.4s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Form Styles */
        .form-card {
            background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 30px;
        }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-light); }
        .form-input, .form-select {
            width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px;
            font-size: 1rem; background: var(--card); color: var(--text);
        }
        .form-input:focus { outline: none; border-color: var(--primary); }
        
        .btn {
            padding: 12px 24px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }

        /* Table & Dropdown */
        .table-wrapper { overflow-x: auto; border-radius: 16px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; background: var(--card); }
        th { background: var(--bg); padding: 16px; text-align: right; font-weight: 700; color: var(--text-light); }
        td { padding: 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        
        .amount-pos { color: var(--success); font-weight: 800; direction: ltr; display: inline-block; }
        .amount-neg { color: var(--danger); font-weight: 800; direction: ltr; display: inline-block; }
        
        .badge { padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }
        .badge-afn { background: #dbeafe; color: #1e40af; }
        .badge-usd { background: #dcfce7; color: #166534; }

        /* Action Dropdown */
        .action-cell { position: relative; }
        .action-btn {
            background: var(--bg); border: 1px solid var(--border); padding: 6px 12px;
            border-radius: 8px; cursor: pointer; color: var(--text); font-size: 0.9rem;
        }
        .dropdown-menu {
            display: none; position: absolute; left: 0; top: 100%; background: var(--card);
            border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            z-index: 10; min-width: 120px; overflow: hidden;
        }
        .dropdown-menu.show { display: block; animation: fadeIn 0.2s; }
        .dropdown-item {
            display: block; width: 100%; padding: 10px; text-align: right; border: none;
            background: none; cursor: pointer; color: var(--text); font-size: 0.9rem;
        }
        .dropdown-item:hover { background: var(--bg); }
        .text-danger { color: var(--danger); }
        .text-warning { color: var(--warning); }

    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
        <h1>💼 مدیریت مالی غلام سرور حسنی</h1>
        <p style="opacity: 0.9;">سیستم هوشمند ثبت و پیگیری معاملات</p>
    </div>

    <div class="tabs-nav">
        <button class="tab-btn active" onclick="switchTab('transactions')">🔄 معاملات</button>
        <button class="tab-btn" onclick="switchTab('expenses')">💸 مصارف</button>
        <button class="tab-btn" onclick="switchTab('reports')">📊 گزارشات</button>
    </div>

    <div class="content-area">
        <!-- Tab: Transactions -->
        <div id="transactions" class="tab-content active">
            <div class="sub-tabs" style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="btn" style="background:#e0e7ff; color:var(--primary)" onclick="setTransType('received')">⬇️ رسید</button>
                <button class="btn" style="background:#fee2e2; color:var(--danger)" onclick="setTransType('sent')">⬆️ برده</button>
            </div>

            <div class="form-card">
                <h3 style="margin-bottom:15px; color:var(--primary)">➕ ثبت معامله جدید</h3>
                <div class="form-grid">
                    <div class="input-group">
                        <label>شرح معامله</label>
                        <input type="text" id="t-desc" class="form-input" placeholder="مثال: فروش کالا">
                    </div>
                    <div class="input-group">
                        <label>مبلغ (فارسی یا انگلیسی)</label>
                        <input type="text" id="t-amount" class="form-input" placeholder="0" oninput="convertToEnglish(this)">
                    </div>
                    <div class="input-group">
                        <label>ارز</label>
                        <select id="t-currency" class="form-select">
                            <option value="AFN">AFN</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="IRR">IRR</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addTransaction()">💾 ذخیره معامله</button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>شماره</th>
                            <th>شرح</th>
                            <th>مبلغ</th>
                            <th>ارز</th>
                            <th>تاریخ</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="trans-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab: Expenses -->
        <div id="expenses" class="tab-content">
            <div class="form-card">
                <h3 style="margin-bottom:15px; color:var(--danger)">➕ ثبت هزینه جدید</h3>
                <div class="form-grid">
                    <div class="input-group">
                        <label>دسته‌بندی</label>
                        <input type="text" id="e-cat" class="form-input" placeholder="مثال: اجاره">
                    </div>
                    <div class="input-group">
                        <label>مبلغ</label>
                        <input type="text" id="e-amount" class="form-input" placeholder="0" oninput="convertToEnglish(this)">
                    </div>
                </div>
                <button class="btn btn-primary" style="background:var(--danger)" onclick="addExpense()">💾 ثبت هزینه</button>
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>شماره</th>
                            <th>دسته‌بندی</th>
                            <th>مبلغ</th>
                            <th>تاریخ</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="exp-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Tab: Reports -->
        <div id="reports" class="tab-content">
            <div class="form-card" style="text-align:center;">
                <h2>خلاصه وضعیت مالی</h2>
                <div style="display:flex; justify-content:space-around; margin-top:20px; flex-wrap:wrap; gap:20px;">
                    <div style="padding:20px; background:var(--bg); border-radius:16px; min-width:200px;">
                        <h3 style="color:var(--success)">درآمد کل</h3>
                        <h1 id="total-income" style="font-size:2rem;">0</h1>
                    </div>
                    <div style="padding:20px; background:var(--bg); border-radius:16px; min-width:200px;">
                        <h3 style="color:var(--danger)">هزینه کل</h3>
                        <h1 id="total-expense" style="font-size:2rem;">0</h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Data & State
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
    let currentType = 'received';
    let editIndex = null;

    // Theme Toggle
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const btn = document.querySelector('.theme-toggle');
        btn.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    // Persian Number Converter
    function convertToEnglish(input) {
        let val = input.value;
        const persianNumbers = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        
        for(let i=0; i<10; i++) {
            val = val.replace(persianNumbers[i], i).replace(arabicNumbers[i], i);
        }
        // Allow only numbers
        input.value = val.replace(/[^0-9]/g, '');
    }

    function saveData() {
        localStorage.setItem('transactions', JSON.stringify(transactions));
        localStorage.setItem('expenses', JSON.stringify(expenses));
        renderTables();
        updateReports();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function setTransType(type) {
        currentType = type;
        document.querySelector('.form-card h3').innerText = type === 'received' ? '➕ ثبت دریافت جدید' : '➕ ثبت پرداخت جدید';
    }

    function addTransaction() {
        const desc = document.getElementById('t-desc').value;
        const amount = document.getElementById('t-amount').value;
        const currency = document.getElementById('t-currency').value;

        if(!desc || !amount) return alert('لطفاً تمام فیلدها را پر کنید');

        const newTrans = {
            id: Date.now(),
            desc,
            amount,
            currency,
            type: currentType,
            date: new Date().toLocaleDateString('fa-IR')
        };

        if(editIndex !== null) {
            transactions[editIndex] = newTrans;
            editIndex = null;
            document.querySelector('.btn-primary').innerText = '💾 ذخیره معامله';
        } else {
            transactions.push(newTrans);
        }

        document.getElementById('t-desc').value = '';
        document.getElementById('t-amount').value = '';
        saveData();
    }

    function addExpense() {
        const cat = document.getElementById('e-cat').value;
        const amount = document.getElementById('e-amount').value;
        if(!cat || !amount) return alert('لطفاً اطلاعات را کامل کنید');

        expenses.push({ id: Date.now(), cat, amount, date: new Date().toLocaleDateString('fa-IR') });
        document.getElementById('e-cat').value = '';
        document.getElementById('e-amount').value = '';
        saveData();
    }

    function deleteItem(type, id) {
        if(confirm('آیا از حذف این مورد اطمینان دارید؟')) {
            if(type === 'trans') transactions = transactions.filter(t => t.id !== id);
            if(type === 'exp') expenses = expenses.filter(e => e.id !== id);
            saveData();
        }
    }

    function editTransaction(id) {
        const item = transactions.find(t => t.id === id);
        if(item) {
            document.getElementById('t-desc').value = item.desc;
            document.getElementById('t-amount').value = item.amount;
            document.getElementById('t-currency').value = item.currency;
            setTransType(item.type);
            editIndex = transactions.indexOf(item);
            document.querySelector('.btn-primary').innerText = '✏️ بروزرسانی معامله';
            window.scrollTo(0,0);
        }
    }

    // Dropdown Logic
    function toggleDropdown(id) {
        const menu = document.getElementById(`menu-${id}`);
        const allMenus = document.querySelectorAll('.dropdown-menu');
        allMenus.forEach(m => {
            if(m !== menu) m.classList.remove('show');
        });
        menu.classList.toggle('show');
    }

    // Close dropdowns when clicking outside
    window.onclick = function(event) {
        if (!event.target.matches('.action-btn')) {
            document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
        }
    }

    function renderTables() {
        const transBody = document.getElementById('trans-table-body');
        transBody.innerHTML = '';
        transactions.forEach((t, index) => {
            const isRec = t.type === 'received';
            const sign = isRec ? '⬇️' : '⬆️';
            const colorClass = isRec ? 'amount-pos' : 'amount-neg';
            
            transBody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${t.desc}</td>
                    <td><span class="${colorClass}">${sign} ${Number(t.amount).toLocaleString('fa-IR')}</span></td>
                    <td><span class="badge badge-${t.currency.toLowerCase()}">${t.currency}</span></td>
                    <td>${t.date}</td>
                    <td class="action-cell">
                        <button class="action-btn" onclick="toggleDropdown(${t.id})">⚙️ عملیات</button>
                        <div id="menu-${t.id}" class="dropdown-menu">
                            <button class="dropdown-item text-warning" onclick="editTransaction(${t.id})">✏️ ویرایش</button>
                            <button class="dropdown-item text-danger" onclick="deleteItem('trans', ${t.id})">🗑️ حذف</button>
                        </div>
                    </td>
                </tr>
            `;
        });

        const expBody = document.getElementById('exp-table-body');
        expBody.innerHTML = '';
        expenses.forEach((e, index) => {
            expBody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${e.cat}</td>
                    <td class="amount-neg">${Number(e.amount).toLocaleString('fa-IR')}</td>
                    <td>${e.date}</td>
                    <td class="action-cell">
                        <button class="action-btn" onclick="toggleDropdown(${e.id})">⚙️ عملیات</button>
                        <div id="menu-${e.id}" class="dropdown-menu">
                            <button class="dropdown-item text-danger" onclick="deleteItem('exp', ${e.id})">🗑️ حذف</button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    function updateReports() {
        const totalInc = transactions.filter(t => t.type === 'received').reduce((sum, t) => sum + Number(t.amount), 0);
        const totalExp = expenses.reduce((sum, e) => sum + Number(e.amount), 0);
        document.getElementById('total-income').innerText = totalInc.toLocaleString('fa-IR');
        document.getElementById('total-expense').innerText = totalExp.toLocaleString('fa-IR');
    }

    renderTables();
    updateReports();
</script>

</body>
</html>
